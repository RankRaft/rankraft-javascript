name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # publint and attw are what catch a broken dual-package exports map.
      # They run here rather than only before a release, because the mistake is
      # made in the PR that changes package.json, not on release day.
      - run: pnpm exec publint
      - run: pnpm exec attw --pack .

  smoke:
    # The live suite is the only check on semantics the spec cannot express.
    # It is skipped when no staging key is configured, never silently green:
    # the summary says which happened.
    #
    # The secret is mapped to env at job level because the `secrets` context
    # is not usable inside a step-level `if`.
    runs-on: ubuntu-latest
    env:
      RANKRAFT_API_KEY: ${{ secrets.RANKRAFT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live smoke
        if: env.RANKRAFT_API_KEY != ''
        env:
          RANKRAFT_LIVE: "1"
        run: pnpm exec vitest run test/live.test.ts
      - name: Say so when it was skipped
        if: env.RANKRAFT_API_KEY == ''
        run: echo "::warning::RANKRAFT_API_KEY is not set, so the live smoke suite did NOT run."
